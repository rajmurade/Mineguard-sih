services:
  db:
    image: postgres:16-alpine
    container_name: mineguard-db
    environment:
      POSTGRES_USER: mineguard
      POSTGRES_PASSWORD: mineguard
      POSTGRES_DB: mineguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineguard -d mineguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: mineguard-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://mineguard:mineguard@db:5432/mineguard
      CORS_ORIGINS: '["*"]'
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./evidence:/app/evidence
    restart: unless-stopped

volumes:
  pgdata: